<style>

<body>
<div id="ar-container"></div>
<div id="message">ARを開始してください</div>
<button id="start-button" type="button">ARを開始</button>
<div id="hint">イラスト全体をカメラに映してください</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MindARThree} from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

// ========================================
// 設定
// ========================================
const TARGET_URL='./targets.mind';
const MODEL_URL='./character.glb';

const MODEL_SIZE=0.7;
const MODEL_X=0;
const MODEL_Y=0;
const MODEL_Z=0;
const WATER_SCALE=6.8;

// ========================================
// HTML要素
// ========================================
const container=document.getElementById('ar-container');
const startButton=document.getElementById('start-button');
const message=document.getElementById('message');
const hint=document.getElementById('hint');

// ========================================
// 状態管理
// ========================================
let mindar=null;
let renderer=null;
let modelGroup=null;
let mixer=null;
let arStarted=false;
let arStarting=false;
let lastTime=0;

// ========================================
// 水面シェーダー
// ========================================
const waterUniforms={
    uTime:{value:0},
    uScale:{value:WATER_SCALE}
};

const waterVertexShader=`
uniform float uTime;
uniform float uScale;
varying vec3 vWorldPosition;
varying vec3 vWorldNormal;
varying vec3 vPosition;

float random(vec2 st){
    return fract(sin(dot(st,vec2(12.9898,78.233)))*43758.5453123);
}
float noise(vec2 st){
    vec2 i=floor(st);
    vec2 f=fract(st);
    float a=random(i);
    float b=random(i+vec2(1.0,0.0));
    float c=random(i+vec2(0.0,1.0));
    float d=random(i+vec2(1.0,1.0));
    vec2 u=f*f*(3.0-2.0*f);
    return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
}
float getWave(vec2 p){
    float wave=0.0;
    wave+=noise(p+vec2(uTime*0.15))*0.009;
    wave+=noise(p*2.0-vec2(uTime*0.10))*0.008;
    wave+=noise(p*3.0+vec2(uTime*0.20))*0.002;
    return wave;
}
void main(){
    vec3 p=position;
    p.y+=getWave(position.xz);
    vec4 world=modelMatrix*vec4(p,1.0);
    vPosition=p;
    vWorldPosition=world.xyz;
    vWorldNormal=normalize(mat3(modelMatrix)*normal);
    gl_Position=projectionMatrix*viewMatrix*world;
}
`;

const waterFragmentShader=`
uniform float uTime;
uniform float uScale;
varying vec3 vWorldPosition;
varying vec3 vWorldNormal;
varying vec3 vPosition;

float random(vec2 st){
    return fract(sin(dot(st,vec2(12.9898,78.233)))*43758.5453123);
}
float noise(vec2 st){
    vec2 i=floor(st);
    vec2 f=fract(st);
    float a=random(i);
    float b=random(i+vec2(1.0,0.0));
    float c=random(i+vec2(0.0,1.0));
    float d=random(i+vec2(1.0,1.0));
    vec2 u=f*f*(3.0-2.0*f);
    return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
}
float fbm(vec2 st){
    float value=0.0;
    float amplitude=0.5;
    float frequency=1.0;
    for(int i=0;i<4;i++){
        value+=amplitude*noise(st*frequency);
        frequency*=2.0;
        amplitude*=0.5;
    }
    return value;
}
float voronoi(vec2 x){
    vec2 n=floor(x);
    vec2 f=fract(x);
    float minDist=1.0;
    for(int j=-1;j<=1;j++){
        for(int i=-1;i<=1;i++){
            vec2 neighbor=vec2(float(i),float(j));
            vec2 point=neighbor+vec2(
                random(n+neighbor),
                random(n+neighbor+vec2(31.7,17.3))
            );
            vec2 d=point-f;
            minDist=min(minDist,dot(d,d));
        }
    }
    return sqrt(minDist);
}
vec3 rainbowColor(float v){
    vec3 c1=vec3(0.20,0.07,0.09);
    vec3 c2=vec3(0.22,0.14,0.07);
    vec3 c3=vec3(0.23,0.21,0.08);
    vec3 c4=vec3(0.08,0.23,0.13);
    vec3 c5=vec3(0.07,0.20,0.23);
    vec3 c6=vec3(0.07,0.11,0.23);
    vec3 c7=vec3(0.17,0.07,0.23);
    if(v<0.16)return mix(c1,c2,v/0.16);
    else if(v<0.32)return mix(c2,c3,(v-0.16)/0.16);
    else if(v<0.48)return mix(c3,c4,(v-0.32)/0.16);
    else if(v<0.64)return mix(c4,c5,(v-0.48)/0.16);
    else if(v<0.80)return mix(c5,c6,(v-0.64)/0.16);
    return mix(c6,c7,(v-0.80)/0.20);
}
void main(){
    vec2 p=vPosition.xz*uScale;
    p.x+=uTime*0.08;
    p.y+=uTime*0.04;

    float n=fbm(p);
    float v=voronoi(p*0.73);
    float pattern=n*0.65+v*0.35;
    vec3 color=rainbowColor(pattern);

    vec3 viewDirection=normalize(cameraPosition-vWorldPosition);
    vec3 normalDirection=normalize(vWorldNormal);
    float fresnel=1.0-max(dot(normalDirection,viewDirection),0.0);
    fresnel=smoothstep(0.15,0.85,fresnel);

    color+=vec3(0.10,0.12,0.14)*fresnel;
    color=mix(color,vec3(0.12,0.13,0.14),0.25);
    color+=vec3(0.12)*smoothstep(0.65,1.0,pattern);

    float alpha=mix(0.28,0.72,fresnel);
    gl_FragColor=vec4(color,alpha);
}
`;

const waterMaterial=new THREE.ShaderMaterial({
    uniforms:waterUniforms,
    vertexShader:waterVertexShader,
    fragmentShader:waterFragmentShader,
    side:THREE.DoubleSide,
    transparent:true,
    depthWrite:false
});

// ========================================
// GLB読み込み
// ページ表示中に読み込みを開始しておく
// ========================================
const loader=new GLTFLoader();

const modelPromise=new Promise((resolve,reject)=>{
    loader.load(
        MODEL_URL,
        (gltf)=>{
            try{
                const model=gltf.scene;
                console.log('GLB読み込み成功');
                console.log('アニメーション:',gltf.animations);

                const box=new THREE.Box3().setFromObject(model);
                const center=box.getCenter(new THREE.Vector3());
                const size=box.getSize(new THREE.Vector3());
                const maxSize=Math.max(size.x,size.y,size.z);

                model.position.sub(center);

                if(maxSize>0){
                    model.scale.setScalar(MODEL_SIZE/maxSize);
                }

                model.position.x+=MODEL_X;
                model.position.y+=MODEL_Y;
                model.position.z+=MODEL_Z;

                // 水面だけ材質を変更
                model.traverse((object)=>{
                    if(object.isMesh&&object.name==='水面'){
                        object.material=waterMaterial;
                        console.log('水面シェーダーを適用');
                    }
                });

                if(gltf.animations&&gltf.animations.length>0){
                    mixer=new THREE.AnimationMixer(model);
                    for(const clip of gltf.animations){
                        mixer.clipAction(clip).reset().play();
                    }
                    console.log('GLBアニメーション再生準備完了');
                }else{
                    console.warn('GLBにアニメーションがありません');
                }

                resolve(model);
            }catch(error){
                reject(error);
            }
        },
        undefined,
        (error)=>{
            console.error('GLB読み込み失敗:',error);
            reject(new Error(
                'character.glbを読み込めません。ファイル名と配置を確認してください。'
            ));
        }
    );
});

// モデル読み込みエラーを早めに記録する。
// ここでは画面表示を変えず、ボタン押下時のエラー表示に任せる。
modelPromise.catch((error)=>{
    console.error('モデル読み込みエラー:',error);
});

// ========================================
// AR初期化
// モデルの読み込みを待たずに初期化できる構成
// ========================================
function createAR(){
    const ar=new MindARThree({
        container:container,
        imageTargetSrc:TARGET_URL,
        maxTrack:1
    });

    mindar=ar;
    renderer=ar.renderer;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000,0);

    const scene=ar.scene;

    scene.add(new THREE.HemisphereLight(0xffffff,0x444455,2));

    const light=new THREE.DirectionalLight(0xffffff,2.5);
    light.position.set(2,4,3);
    scene.add(light);

    const anchor=ar.addAnchor(0);

    modelGroup=new THREE.Group();
    anchor.group.add(modelGroup);

    anchor.onTargetFound=()=>{
        message.textContent='画像を認識しました';
        hint.textContent='スマホをゆっくり動かしてください';
    };

    anchor.onTargetLost=()=>{
        message.textContent='画像を探しています…';
        hint.textContent='イラスト全体をカメラに映してください';
    };

    return ar;
}

// ========================================
// AR開始ボタン
// iPhone Safariでは、クリック直後にstart()を呼ぶ
// await modelPromiseより先にカメラ起動を開始する
// ========================================
startButton.addEventListener('click',async()=>{
    if(arStarted||arStarting)return;

    arStarting=true;
    startButton.disabled=true;
    startButton.textContent='起動中…';
    message.textContent='ARを初期化しています…';
    hint.textContent='カメラの許可を求められたら「許可」を選んでください';

    try{
        if(!window.isSecureContext){
            throw new Error('HTTPSでページを開いてください。');
        }

        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
            throw new Error(
                'カメラ機能を利用できません。iPhone SafariでHTTPSのページを開いているか確認してください。'
            );
        }

        // MindARの初期化はクリック処理内で行う
        const ar=createAR();

        // 重要：モデル読み込みをawaitする前にカメラ起動を開始する
        message.textContent='カメラを起動しています…';
        const startPromise=ar.start();

        // カメラ起動とモデル読み込みを並行して進める
        const model=await modelPromise;

        // モデルをARアンカーに追加
        modelGroup.add(model);

        message.textContent='カメラの起動を待っています…';
        await startPromise;

        arStarted=true;
        startButton.style.display='none';
        message.textContent='イラスト全体をカメラに映してください';
        hint.textContent='認識すると3Dモデルが現れます';

        lastTime=performance.now();

        renderer.setAnimationLoop(()=>{
            const now=performance.now();
            const delta=Math.min((now-lastTime)/1000,0.05);
            lastTime=now;

            waterUniforms.uTime.value+=delta;
            if(mixer)mixer.update(delta);

            renderer.render(ar.scene,ar.camera);
        });

    }catch(error){
        console.error('AR起動エラー:',error);

        const details=error&&error.message
            ?error.message
            :String(error);

        message.textContent='ARを起動できませんでした';
        hint.textContent=details;

        // 起動に失敗した場合はカメラを止めて再試行できるようにする
        if(mindar){
            try{
                renderer?.setAnimationLoop(null);
                mindar.stop();
            }catch(stopError){
                console.warn('AR停止時のエラー:',stopError);
            }
        }

        mindar=null;
        renderer=null;
        modelGroup=null;
        arStarted=false;
        startButton.disabled=false;
        startButton.textContent='もう一度試す';

    }finally{
        arStarting=false;
    }
});

// ========================================
// JavaScriptエラーを画面とコンソールに表示
// ========================================
window.addEventListener('error',(event)=>{
    console.error('JavaScriptエラー:',event.message,event.error);

    if(!arStarted){
        message.textContent='JavaScriptエラーが発生しました';
        hint.textContent=event.message||'詳細はコンソールを確認してください';
    }
});

window.addEventListener('unhandledrejection',(event)=>{
    const reason=event.reason;
    console.error('非同期処理エラー:',reason);

    if(!arStarted){
        message.textContent='非同期処理エラーが発生しました';
        hint.textContent=reason?.message||String(reason);
    }
});

// ========================================
// ファイルの事前確認
// ========================================
async function checkFile(url,label){
    try{
        const response=await fetch(url,{method:'HEAD',cache:'no-store'});

        if(!response.ok){
            console.error(label+' HTTPエラー:',response.status,url);
            return false;
        }

        console.log(label+'確認OK:',url);
        return true;
    }catch(error){
        console.warn(label+'の事前確認に失敗:',error);
        return false;
    }
}

checkFile(TARGET_URL,'targets.mind');
checkFile(MODEL_URL,'character.glb');

// ========================================
// ページ終了時にカメラを停止
// ========================================
window.addEventListener('pagehide',()=>{
    if(mindar){
        try{
            renderer?.setAnimationLoop(null);
            mindar.stop();
        }catch(error){
            console.warn('AR停止時のエラー:',error);
        }
    }
});
</script>
</body>
</html>

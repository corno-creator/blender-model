
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB Model Viewer</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #171923;
  color: white;
  font-family: sans-serif;
}
#viewer {
  position: fixed;
  inset: 0;
}
#status {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  padding: 12px 14px;
  background: rgba(0,0,0,0.65);
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.5;
  pointer-events: none;
}
#controls {
  position: fixed;
  bottom: 18px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 10px;
}
button {
  padding: 10px 16px;
  border: 0;
  border-radius: 8px;
  background: #e5e7eb;
  color: #111827;
  font-size: 14px;
  cursor: pointer;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="viewer"></div>
<div id="status">3Dモデルを読み込んでいます...</div>
<div id="controls">
  <button id="playButton" disabled>再生</button>
  <button id="resetButton" disabled>最初に戻す</button>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const MODEL_PATH = "./character.glb";

const viewer = document.getElementById("viewer");
const status = document.getElementById("status");
const playButton = document.getElementById("playButton");
const resetButton = document.getElementById("resetButton");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171923);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);
camera.position.set(0, 1, 5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.1;
controls.maxDistance = 1000;

scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 2));

const keyLight = new THREE.DirectionalLight(0xffffff, 3);
keyLight.position.set(4, 6, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9bbcff, 1.5);
fillLight.position.set(-4, 2, -3);
scene.add(fillLight);

const clock = new THREE.Clock();
let mixer = null;
let actions = [];
let isPlaying = true;
let model = null;

function updatePlayButton() {
  playButton.textContent = isPlaying ? "一時停止" : "再生";
}

function frameModel(object) {
  const box = new THREE.Box3().setFromObject(object);
  if (box.isEmpty()) {
    throw new Error("モデルの大きさを取得できませんでした。");
  }

  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDimension = Math.max(size.x, size.y, size.z);

  if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
    throw new Error("モデルのサイズが不正です。");
  }

  // モデルの中心を原点に移動
  object.position.sub(center);

  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const distance = (maxDimension / 2) / Math.tan(halfFov) * 1.6;

  camera.position.set(
    distance * 0.15,
    distance * 0.12,
    distance
  );
  camera.near = Math.max(maxDimension / 1000, 0.001);
  camera.far = Math.max(maxDimension * 100, 100);
  camera.updateProjectionMatrix();

  controls.target.set(0, 0, 0);
  controls.minDistance = Math.max(maxDimension * 0.1, 0.01);
  controls.maxDistance = Math.max(maxDimension * 20, 10);
  controls.update();
}

const loader = new GLTFLoader();

loader.load(
  MODEL_PATH,
  (gltf) => {
    model = gltf.scene;
    scene.add(model);

    try {
      frameModel(model);
    } catch (error) {
      status.textContent = "モデルの配置に失敗しました: " + error.message;
      console.error(error);
      return;
    }

    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);

      actions = gltf.animations.map((clip) => {
        const action = mixer.clipAction(clip);
        action.reset();
        action.play();
        return action;
      });

      isPlaying = true;
      status.textContent =
        "読み込み完了｜アニメーション " +
        gltf.animations.length +
        "個｜ドラッグで視点を回転できます";

      console.log("アニメーション一覧:", gltf.animations);
    } else {
      isPlaying = false;
      status.textContent =
        "モデル読み込み完了｜GLBにアニメーションが見つかりません";
    }

    updatePlayButton();
    playButton.disabled = actions.length === 0;
    resetButton.disabled = actions.length === 0;
  },
  (event) => {
    if (event.total > 0) {
      const percent = Math.round(event.loaded / event.total * 100);
      status.textContent = "読み込み中... " + percent + "%";
    }
  },
  (error) => {
    console.error("GLB読み込みエラー:", error);
    status.textContent =
      "読み込み失敗。character.glbの名前・配置・公開状態を確認してください。";
  }
);

playButton.addEventListener("click", () => {
  if (!mixer || actions.length === 0) return;

  isPlaying = !isPlaying;

  for (const action of actions) {
    if (isPlaying) {
      action.paused = false;
      action.play();
    } else {
      action.paused = true;
    }
  }

  updatePlayButton();
});

resetButton.addEventListener("click", () => {
  if (!mixer || actions.length === 0) return;

  for (const action of actions) {
    action.reset();
    action.play();
    action.paused = !isPlaying;
  }

  mixer.update(0);
  updatePlayButton();
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (mixer && isPlaying) {
    mixer.update(delta);
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blender Model - Moving Water</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
    'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
    'three/addons/controls/OrbitControls.js';


// ============================================================
// シーン
// ============================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x111111);


// ============================================================
// カメラ
// ============================================================

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 1, 5);


// ============================================================
// レンダラー
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


// ============================================================
// ライト
// ============================================================

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    2
);

scene.add(ambientLight);


const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

directionalLight.position.set(3, 5, 3);

scene.add(directionalLight);


// ============================================================
// マウス操作
// ============================================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;


// ============================================================
// 水面用 Shader
// ============================================================

// 時間
const waterUniforms = {

    uTime: {
        value: 0
    },

    // Noiseの細かさ
    uScale: {
        value: 6.8
    }

};


// ============================================================
// Vertex Shader
// ============================================================

const waterVertexShader = `

    varying vec3 vPosition;

    void main() {

        vPosition = position;

        gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(position, 1.0);

    }

`;


// ============================================================
// Fragment Shader
// ============================================================

const waterFragmentShader = `

    uniform float uTime;

    uniform float uScale;

    uniform vec3 uColor1;

    uniform vec3 uColor2;


    varying vec3 vPosition;


    // ========================================================
    // 2D Noise
    // ========================================================

    float random(vec2 st)
    {
        return fract(
            sin(
                dot(
                    st,
                    vec2(
                        12.9898,
                        78.233
                    )
                )
            ) * 43758.5453123
        );
    }


    float noise(vec2 st)
    {

        vec2 i = floor(st);

        vec2 f = fract(st);


        // 四隅のランダム値

        float a = random(i);

        float b = random(i + vec2(1.0, 0.0));

        float c = random(i + vec2(0.0, 1.0));

        float d = random(i + vec2(1.0, 1.0));


        // 滑らかな補間

        vec2 u =
            f * f *
            (
                3.0 -
                2.0 * f
            );


        return mix(
            a,
            b,
            u.x
        )
        +
        (
            c - a
        )
        * u.y
        *
        (
            1.0 - u.x
        )
        +
        (
            d - b
        )
        *
        u.x
        *
        u.y;

    }


    // ========================================================
    // 複数のNoiseを重ねる
    // ========================================================

    float fbm(vec2 st)
    {

        float value = 0.0;

        float amplitude = 0.5;

        float frequency = 1.0;


        for (int i = 0; i < 4; i++)
        {

            value +=
                amplitude *
                noise(
                    st *
                    frequency
                );


            frequency *= 2.0;

            amplitude *= 0.5;

        }


        return value;

    }


    // ========================================================
    // メイン
    // ========================================================

    void main()
    {

        // --------------------------------------------
        // 水面の座標
        // --------------------------------------------

        vec2 position =
            vPosition.xz;


        // --------------------------------------------
        // BlenderのNoise Scale 6.8に近い値
        // --------------------------------------------

        position *= uScale;


        // --------------------------------------------
        // 時間でNoiseの位置を動かす
        // --------------------------------------------

        position.x += uTime * 0.35;

        position.y += uTime * 0.20;


        // --------------------------------------------
        // Noise
        // --------------------------------------------

        float n =
            fbm(position);


        // --------------------------------------------
        // 色をNoiseに応じて変える
        // --------------------------------------------

        // ========================================================
// 虹色のカラーパレット
// ========================================================

vec3 color1 = vec3(1.0, 0.05, 0.25);  // 赤～ピンク
vec3 color2 = vec3(1.0, 0.45, 0.02);  // オレンジ
vec3 color3 = vec3(1.0, 0.95, 0.05);  // 黄色
vec3 color4 = vec3(0.05, 1.0, 0.35);  // 緑
vec3 color5 = vec3(0.05, 0.8, 1.0);   // 水色
vec3 color6 = vec3(0.05, 0.25, 1.0);  // 青
vec3 color7 = vec3(0.7, 0.05, 1.0);   // 紫


vec3 color;

if (n < 0.16)
{
    color = mix(
        color1,
        color2,
        n / 0.16
    );
}
else if (n < 0.32)
{
    color = mix(
        color2,
        color3,
        (n - 0.16) / 0.16
    );
}
else if (n < 0.48)
{
    color = mix(
        color3,
        color4,
        (n - 0.32) / 0.16
    );
}
else if (n < 0.64)
{
    color = mix(
        color4,
        color5,
        (n - 0.48) / 0.16
    );
}
else if (n < 0.80)
{
    color = mix(
        color5,
        color6,
        (n - 0.64) / 0.16
    );
}
else
{
    color = mix(
        color6,
        color7,
        (n - 0.80) / 0.20
    );
}


        // --------------------------------------------
        // 出力
        // --------------------------------------------

        gl_FragColor =
            vec4(
                color,
                1.0
            );

    }

`;


// ============================================================
// 水面ShaderMaterial
// ============================================================

const waterMaterial = new THREE.ShaderMaterial({

    uniforms: waterUniforms,

    vertexShader: waterVertexShader,

    fragmentShader: waterFragmentShader,

    side: THREE.DoubleSide

});


// ============================================================
// GLB読み込み
// ============================================================

const loader = new GLTFLoader();

loader.load(

    'character.glb',

    function (gltf) {

        console.log('GLB読み込み成功');

        console.log(
            'アニメーション:',
            gltf.animations
        );


        const model = gltf.scene;


        // ====================================================
        // GLBの中身を確認
        // ====================================================

        model.traverse(function (object) {

            console.log(
                'オブジェクト:',
                object.name,
                '種類:',
                object.type
            );


            // ==================================================
            // 水面だけShaderMaterialに変更
            // ==================================================

            if (
                object.isMesh &&
                object.name === '水面'
            ) {

                console.log(
                    '★ 水面をShaderMaterialに変更しました'
                );


                object.material =
                    waterMaterial;

            }

        });


        // ====================================================
        // シーンに追加
        // ====================================================

        scene.add(model);


        // ====================================================
        // モデルの大きさを取得
        // ====================================================

        const box =
            new THREE.Box3()
                .setFromObject(model);


        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        const size =
            box.getSize(
                new THREE.Vector3()
            );


        // ====================================================
        // モデルを中央に配置
        // ====================================================

        model.position.sub(center);


        // ====================================================
        // カメラをモデルに合わせる
        // ====================================================

        const maxSize =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        camera.position.set(
            0,
            maxSize * 0.5,
            maxSize * 2.5
        );


        controls.target.set(
            0,
            0,
            0
        );


        controls.update();

    },

    undefined,

    function (error) {

        console.error(
            'GLB読み込みエラー:',
            error
        );

    }

);


// ============================================================
// アニメーションループ
// ============================================================

const clock =
    new THREE.Clock();


function animate()
{

    requestAnimationFrame(
        animate
    );


    // ========================================================
    // 経過時間
    // ========================================================

    const elapsedTime =
        clock.getElapsedTime();


    // ========================================================
    // 水面の時間を更新
    // ========================================================

    waterUniforms.uTime.value =
        elapsedTime;


    // ========================================================
    // マウス操作
    // ========================================================

    controls.update();


    // ========================================================
    // 描画
    // ========================================================

    renderer.render(
        scene,
        camera
    );

}


animate();


// ============================================================
// ウィンドウサイズ変更
// ============================================================

window.addEventListener(
    'resize',
    function ()
    {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>

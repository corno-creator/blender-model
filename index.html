<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Corno - Image AR</title>
<style>
    #ar-container{
    position:fixed;
    inset:0;

}

#ar-container video,
#ar-container canvas{

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:sans-serif}
#ar-container{position:fixed;inset:0}
#start-button{position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 28px;border:1px solid #b8aa72;border-radius:8px;background:#202522;color:#fff;font-size:16px;cursor:pointer}
#message{position:fixed;z-index:10;top:20px;left:50%;transform:translateX(-50%);width:90%;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 5px #000;pointer-events:none}
#hint{position:fixed;z-index:5;bottom:25px;left:0;width:100%;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 5px #000;pointer-events:none}
</style>
</head>
<body>
<div id="ar-container"></div>
<div id="message">イラスト全体をカメラに映してください</div>
<button id="start-button">ARを開始</button>
<div id="hint">イラストをカメラに映すとモデルが現れます</div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MindARThree} from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

// ========================================
// 設定
// ========================================
const TARGET_URL='./targets.mind';
const MODEL_URL='./character.glb';

// モデルの大きさ。
// 0.7 = 認識画像の幅に対して、モデルの最大寸法を約70%にする
const MODEL_SIZE=0.7;

// モデルの位置調整
const MODEL_X=0;
const MODEL_Y=0;
const MODEL_Z=0;

// 水面の模様の密度
const WATER_SCALE=6.8;

// ========================================
// HTML
// ========================================
const container=document.querySelector('#ar-container');
const startButton=document.querySelector('#start-button');
const message=document.querySelector('#message');
const hint=document.querySelector('#hint');

// ========================================
// 水面シェーダー
// ========================================
const waterUniforms={
    uTime:{value:0},
    uScale:{value:WATER_SCALE}
};

const waterVertexShader=`
uniform float uTime;
uniform float uScale;
varying vec3 vWorldPosition;
varying vec3 vWorldNormal;
varying vec3 vPosition;

float random(vec2 st){
    return fract(sin(dot(st,vec2(12.9898,78.233)))*43758.5453123);
}

float noise(vec2 st){
    vec2 i=floor(st);
    vec2 f=fract(st);
    float a=random(i);
    float b=random(i+vec2(1.0,0.0));
    float c=random(i+vec2(0.0,1.0));
    float d=random(i+vec2(1.0,1.0));
    vec2 u=f*f*(3.0-2.0*f);
    return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
}

float getWave(vec2 p){
    float wave=0.0;
    wave+=noise(p+vec2(uTime*0.15))*0.009;
    wave+=noise(p*2.0-vec2(uTime*0.10))*0.008;
    wave+=noise(p*3.0+vec2(uTime*0.20))*0.002;
    return wave;
}

void main(){
    vec3 p=position;
    p.y+=getWave(position.xz);
    vec4 world=modelMatrix*vec4(p,1.0);
    vPosition=p;
    vWorldPosition=world.xyz;
    vWorldNormal=normalize(mat3(modelMatrix)*normal);
    gl_Position=projectionMatrix*viewMatrix*world;
}
`;

const waterFragmentShader=`
uniform float uTime;
uniform float uScale;
varying vec3 vWorldPosition;
varying vec3 vWorldNormal;
varying vec3 vPosition;

float random(vec2 st){
    return fract(sin(dot(st,vec2(12.9898,78.233)))*43758.5453123);
}

float noise(vec2 st){
    vec2 i=floor(st);
    vec2 f=fract(st);
    float a=random(i);
    float b=random(i+vec2(1.0,0.0));
    float c=random(i+vec2(0.0,1.0));
    float d=random(i+vec2(1.0,1.0));
    vec2 u=f*f*(3.0-2.0*f);
    return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
}

float fbm(vec2 st){
    float value=0.0;
    float amplitude=0.5;
    float frequency=1.0;
    for(int i=0;i<4;i++){
        value+=amplitude*noise(st*frequency);
        frequency*=2.0;
        amplitude*=0.5;
    }
    return value;
}

float voronoi(vec2 x){
    vec2 n=floor(x);
    vec2 f=fract(x);
    float minDist=1.0;
    for(int j=-1;j<=1;j++){
        for(int i=-1;i<=1;i++){
            vec2 neighbor=vec2(float(i),float(j));
            vec2 point=neighbor+vec2(
                random(n+neighbor),
                random(n+neighbor+vec2(31.7,17.3))
            );
            vec2 d=point-f;
            minDist=min(minDist,dot(d,d));
        }
    }
    return sqrt(minDist);
}

vec3 rainbowColor(float v){
    vec3 c1=vec3(0.20,0.07,0.09);
    vec3 c2=vec3(0.22,0.14,0.07);
    vec3 c3=vec3(0.23,0.21,0.08);
    vec3 c4=vec3(0.08,0.23,0.13);
    vec3 c5=vec3(0.07,0.20,0.23);
    vec3 c6=vec3(0.07,0.11,0.23);
    vec3 c7=vec3(0.17,0.07,0.23);
    if(v<0.16)return mix(c1,c2,v/0.16);
    else if(v<0.32)return mix(c2,c3,(v-0.16)/0.16);
    else if(v<0.48)return mix(c3,c4,(v-0.32)/0.16);
    else if(v<0.64)return mix(c4,c5,(v-0.48)/0.16);
    else if(v<0.80)return mix(c5,c6,(v-0.64)/0.16);
    return mix(c6,c7,(v-0.80)/0.20);
}

void main(){
    vec2 p=vPosition.xz*uScale;
    p.x+=uTime*0.08;
    p.y+=uTime*0.04;

    float n=fbm(p);
    float v=voronoi(p*0.73);
    float pattern=n*0.65+v*0.35;
    vec3 color=rainbowColor(pattern);

    vec3 viewDirection=normalize(cameraPosition-vWorldPosition);
    vec3 normalDirection=normalize(vWorldNormal);
    float fresnel=1.0-max(dot(normalDirection,viewDirection),0.0);
    fresnel=smoothstep(0.15,0.85,fresnel);

    color+=vec3(0.10,0.12,0.14)*fresnel;
    color=mix(color,vec3(0.12,0.13,0.14),0.25);
    color+=vec3(0.12)*smoothstep(0.65,1.0,pattern);

    float alpha=mix(0.28,0.72,fresnel);
    gl_FragColor=vec4(color,alpha);
}
`;

const waterMaterial=new THREE.ShaderMaterial({
    uniforms:waterUniforms,
    vertexShader:waterVertexShader,
    fragmentShader:waterFragmentShader,
    side:THREE.DoubleSide,
    transparent:true,
    depthWrite:false
});

// ========================================
// MindAR
// ========================================
const mindar=new MindARThree({
    container:container,
    imageTargetSrc:TARGET_URL,
    maxTrack:1
});

const scene=mindar.scene;
const camera=mindar.camera;
const renderer=mindar.renderer;

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setClearColor(0x000000,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x444455,2));

const light=new THREE.DirectionalLight(0xffffff,2.5);
light.position.set(2,4,3);
scene.add(light);

// 認識画像に追従するアンカー
const anchor=mindar.addAnchor(0);

// モデルをまとめるグループ
const modelGroup=new THREE.Group();
anchor.group.add(modelGroup);

let mixer=null;
let modelLoaded=false;
let arStarted=false;
let lastTime=0;

// ========================================
// GLB読み込み
// ========================================
const loader=new GLTFLoader();

loader.load(
    MODEL_URL,
    (gltf)=>{
        const model=gltf.scene;
        console.log('GLB読み込み成功');
        console.log('アニメーション:',gltf.animations);

        // モデルの中心とサイズを計算
        const box=new THREE.Box3().setFromObject(model);
        const center=box.getCenter(new THREE.Vector3());
        const size=box.getSize(new THREE.Vector3());
        const maxSize=Math.max(size.x,size.y,size.z);

        if(maxSize>0){
            model.position.sub(center);
            const scale=MODEL_SIZE/maxSize;
            model.scale.setScalar(scale);
        }

        model.position.x+=MODEL_X;
        model.position.y+=MODEL_Y;
        model.position.z+=MODEL_Z;

        // 水面だけシェーダーを適用
        model.traverse((object)=>{
            console.log('オブジェクト:',object.name,object.type);
            if(object.isMesh&&object.name==='水面'){
                object.material=waterMaterial;
                console.log('水面シェーダー適用');
            }
        });

        modelGroup.add(model);

        // GLBアニメーション
        if(gltf.animations&&gltf.animations.length>0){
            mixer=new THREE.AnimationMixer(model);
            for(const clip of gltf.animations){
                mixer.clipAction(clip).reset().play();
            }
            console.log('アニメーション再生開始');
        }else{
            console.warn('GLBにアニメーションがありません');
        }

        modelLoaded=true;
        message.textContent='イラストをカメラに映してください';
    },
    undefined,
    (error)=>{
        console.error('GLB読み込みエラー:',error);
        message.textContent='モデルの読み込みに失敗しました';
    }
);

// ========================================
// 画像認識イベント
// ========================================
anchor.onTargetFound=()=>{
    message.textContent='画像を認識しました';
    hint.textContent='スマホをゆっくり動かしてください';
};

anchor.onTargetLost=()=>{
    message.textContent='画像を探しています…';
    hint.textContent='イラスト全体をカメラに映してください';
};

// ========================================
// AR開始
// ========================================
startButton.addEventListener('click',async()=>{
    if(arStarted)return;

    startButton.disabled=true;
    startButton.textContent='起動中…';
    message.textContent='カメラを起動しています…';

    try{
        await mindar.start();
        arStarted=true;
        startButton.style.display='none';
        message.textContent=modelLoaded
            ?'イラスト全体をカメラに映してください'
            :'3Dモデルを読み込んでいます…';
        lastTime=performance.now();
        renderer.setAnimationLoop(()=>{
            const now=performance.now();
            const delta=Math.min((now-lastTime)/1000,0.05);
            lastTime=now;

            waterUniforms.uTime.value+=delta;
            if(mixer)mixer.update(delta);

            renderer.render(scene,camera);
        });
    }catch(error){
        console.error('AR起動エラー:',error);
        message.textContent='カメラを起動できませんでした。HTTPSとカメラの許可を確認してください';
        startButton.disabled=false;
        startButton.textContent='もう一度試す';
    }
});

// ページを離れるときにカメラを停止
window.addEventListener('pagehide',()=>{
    if(arStarted){
        renderer.setAnimationLoop(null);
        mindar.stop();
    }
});
</script>
</body>
</html>

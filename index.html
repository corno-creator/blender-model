<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Corno AR</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#container {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

#startButton {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  z-index: 10;
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: white;
  color: black;
}

#message {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  color: white;
  font-size: 16px;
  text-align: center;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="container"></div>

<div id="message">
カードをカメラに映してください
</div>

<button id="startButton">
ARを開始
</button>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MindARThree } from 'mindar-image-three';

let mindarThree;
let mixer = null;
let model = null;

const container = document.querySelector("#container");
const startButton = document.querySelector("#startButton");
const message = document.querySelector("#message");

async function setup() {

  console.log("AR setup開始");

  mindarThree = new MindARThree({
    container: container,
    imageTargetSrc: "./targets.mind"
  });

  const {
    renderer,
    scene,
    camera
  } = mindarThree;

  /*
   * 光
   */

  const ambientLight = new THREE.AmbientLight(
    0xffffff,
    2
  );

  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    2
  );

  directionalLight.position.set(
    1,
    2,
    1
  );

  scene.add(directionalLight);

  /*
   * ARマーカーとの接続
   *
   * targets.mindの1番目ではなく
   * 最初のマーカーなので「0」
   */

  const anchor = mindarThree.addAnchor(0);

  /*
   * GLB読み込み
   */

  const loader = new GLTFLoader();

  loader.load(
    "./character.glb",

    function(gltf) {

      console.log("GLB読み込み成功");

      model = gltf.scene;

      /*
       * モデルの大きさ
       */

      model.scale.set(
        0.3,
        0.3,
        0.3
      );

      /*
       * モデルの位置
       *
       * ARマーカーの上に出す
       */

      model.position.set(
        0,
        0,
        0
      );

      /*
       * モデルをARマーカーに追加
       */

      anchor.group.add(model);

      /*
       * アニメーション
       */

      if (gltf.animations.length > 0) {

        console.log(
          "アニメーション数:",
          gltf.animations.length
        );

        mixer = new THREE.AnimationMixer(model);

        gltf.animations.forEach(
          function(clip) {

            console.log(
              "Animation:",
              clip.name
            );

            const action =
              mixer.clipAction(clip);

            action.play();

          }
        );

      } else {

        console.log(
          "GLBにアニメーションがありません"
        );

      }

      message.textContent =
        "カードをカメラに映してください";

    },

    function(progress) {

      if (progress.total > 0) {

        const percent =
          Math.round(
            progress.loaded /
            progress.total *
            100
          );

        message.textContent =
          "モデル読み込み中 " +
          percent +
          "%";

      }

    },

    function(error) {

      console.error(
        "GLB読み込みエラー:",
        error
      );

      message.textContent =
        "GLBの読み込みに失敗しました";

    }
  );

  /*
   * AR開始
   */

  await mindarThree.start();

  console.log("AR開始");

  message.textContent =
    "カードをカメラに映してください";

  renderer.setAnimationLoop(
    function(time, frame) {

      /*
       * GLBアニメーション更新
       */

      if (mixer) {

        mixer.update(
          renderer.info.render.frame > 0
            ? 1 / 60
            : 0
        );

      }

      renderer.render(
        scene,
        camera
      );

    }
  );

}

/*
 * AR開始ボタン
 */

startButton.addEventListener(
  "click",
  async function() {

    startButton.style.display = "none";

    try {

      await setup();

    } catch(error) {

      console.error(
        "AR開始エラー:",
        error
      );

      message.textContent =
        "ARを開始できませんでした";

      startButton.style.display =
        "block";

    }

  }
);

</script>

</body>
</html>

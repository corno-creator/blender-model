<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindAR Card Test</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe
extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image
aframe.prod.js"></script>
<style>
  html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #err {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 99999;
    background: rgba(200, 0, 0, 0.9);
    color: #fff;
    font-size: 12px;
    padding: 6px 8px;
display: none;
    white-space: pre-wrap;
word-break: break-all;
  }
</style>
<script>
/* エラーを画面に表示(スマホでコンソールが見られないため) */
window.addEventListener('error', function (e) {
var box = document.getElementById('err');
if (!box) return;
box.style.display = 'block';
  box.textContent += (e.message || 'error') + ' ' + (e.filename || '') + ':' + 
(e.lineno || '') + '\n';
});
/*
  water-shader:
  ｢水面｣メッシュだけ青い波打つシェーダーに差し替える｡
  - 水面は depthWrite を切り､描画順を先にする
  - 他の半透明メッシュは水面より後に描画する
  失敗しても元のモデルはそのまま表示する｡
*/
if (window.AFRAME) {
  AFRAME.registerComponent('water-shader', {
    schema: {
      meshName: { default: '水面' }
    },
    init: function () {
      var THREE = AFRAME.THREE;
      var self = this;
      this.uniforms = { uTime: { value: 0 } };
      this.el.addEventListener('model-loaded', function () {
        try {
          var root = self.el.getObject3D('mesh');
          if (!root) return;
          var waterMaterial = new THREE.ShaderMaterial({
            uniforms: self.uniforms,
            vertexShader:
              'uniform float uTime;' +
              'void main() {' +
              '  vec3 pos = position;' +
              '  pos.y += sin(pos.x * 4.0 + uTime) * 0.02;' +
              '  pos.y += cos(pos.z * 4.0 + uTime) * 0.02;' +
              '  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);' +
              '}',
            fragmentShader:
              'void main() {' +
              '  gl_FragColor = vec4(0.0, 0.5, 1.0, 0.8);' +
              '}',
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide
          });
          root.traverse(function (obj) {
            if (!obj.isMesh) return;
            if (obj.name === self.data.meshName) {
              obj.material = waterMaterial;
              obj.renderOrder = 1;
            } else if (obj.material && obj.material.transparent) {
              obj.renderOrder = 2;
            }
          });
        } catch (err) {
          var box = document.getElementById('err');
          if (box) {
            box.style.display = 'block';
            box.textContent += 'water-shader: ' + err.message + '\n';
          }
        }
      });
    },
    tick: function (time) {
      this.uniforms.uTime.value = time / 1000;
    }
  });
}
</script>
</head>
<body>
<div id="err"></div>
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind"
  color-space="sRGB"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets>
    <a-asset-item id="avatar" src="./character.glb"></a-asset-item>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model
      id="avatarModel"
      src="#avatar"
      position="0 0 0.1"
      scale="1 1 1"
      rotation="0 0 0"
      animation-mixer
      water-shader>
    </a-gltf-model>
</a-entity>
</a-scene>
</body>
</html>

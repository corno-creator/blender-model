<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindAR Card Test</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
</style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind"
  color-space="sRGB"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="avatar"
      src="./character.glb">
    </a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-gltf-model
      id="avatarModel"
      src="#avatar"
      position="0 2 0"
      scale="1 1 1"
      rotation="90 0 0"
      animation-mixer>
    </a-gltf-model>

  </a-entity>

</a-scene>

<script>

document
.querySelector("#avatarModel")
.addEventListener("model-loaded", (e)=>{

  e.detail.model.traverse((obj)=>{

    if(!obj.isMesh) return;

    if(obj.name === "CardBack"){
      obj.renderOrder = 1;
    }

    if(obj.name === "CardText"){
      obj.renderOrder = 2;
    }

    if(obj.name === "CardCharacter"){
      obj.renderOrder = 3;
    }

    if(obj.name === "CardStar"){
      obj.renderOrder = 4;
    }

    if(obj.material){

      obj.material.transparent = true;

      obj.material.depthWrite = false;

      obj.material.needsUpdate = true;

    }

    console.log(
      obj.name,
      obj.renderOrder
    );

  });

});

</script>

</body>
</html>

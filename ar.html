<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MindAR Card Test</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;  /* スワイプでページがスクロール・ズームしないように */
  }


</style>

<script>


/*
  描画順
  水面 → 1
  平面004系(CardBack/CardText/側面) → 10
  CardCharacter → 20
  CardStar → 30
*/
function getAutoOrder(name) {

  if (!name) return null;

  if (name.indexOf('水面') !== -1) {
    return 1;
  }

  if (name.indexOf('平面004') === 0) {
    return 10;
  }

  if (name.indexOf('CardCharacter') === 0) {
    return 20;
  }

  if (name.indexOf('CardStar') === 0) {
    return 30;
  }

  return null;
}


if (window.AFRAME) {

  AFRAME.registerComponent('draw-order', {

    init: function () {

      var self = this;

      this.el.addEventListener('model-loaded', function () {

        var root = self.el.getObject3D('mesh');

        if (!root) return;

        root.traverse(function (obj) {

          if (!obj.isMesh || !obj.material) return;

          var name = obj.name || '';
var order = getAutoOrder(name);

if (order !== null) {

  obj.renderOrder = order;

  var mats = Array.isArray(obj.material)
    ? obj.material
    : [obj.material];

  mats.forEach(function (m) {
    m.needsUpdate = true;
  });

}

          if (order !== null) {

            obj.renderOrder = order;

            mats.forEach(function (m) {
  m.needsUpdate = true;
});


          }

        });

      });

    }

  });

}

/*
  ドラッグ / スワイプで回転（離すと惰性でくるくる回り、徐々に減速）
  横の動き → Z軸（カードの面に垂直な軸）まわりに回る。惰性あり
  縦の動き → X軸（カードの横軸）まわりに傾く。±maxTilt 度まで
  ピンチ / マウスホイール → 拡大縮小。minScale 〜 maxScale 倍まで
*/
if (window.AFRAME) {

  AFRAME.registerComponent('drag-spin', {

    schema: {
      speed: { type: 'number', default: 0.01 },     // 1px あたりの回転量(rad)
      friction: { type: 'number', default: 0.95 },  // 惰性の減衰（1に近いほど長く回る）
      maxTilt: { type: 'number', default: 30 },     // 上下の傾きの上限(度)
      minScale: { type: 'number', default: 0.5 },   // 縮小の下限(倍)
      maxScale: { type: 'number', default: 3 },     // 拡大の上限(倍)
      wheelSpeed: { type: 'number', default: 0.001 } // ホイール1目盛りあたりの拡大量
    },

    init: function () {

      var self = this;
      this.dragging = false;
      this.pinching = false;
      this.lastX = 0;
      this.lastY = 0;
      this.lastTime = 0;
      this.velocity = 0;  // rad / ms
      this.tilt = 0;      // 現在の傾き(rad)
      this.zoom = 1;      // 現在の拡大率
      this.pinchStartDist = 0;
      this.pinchStartZoom = 1;

      function getPoint(e) {
        return e.touches ? e.touches[0] : e;
      }

      function touchDist(e) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      this.setZoom = function (z) {
        self.zoom = Math.max(self.data.minScale, Math.min(self.data.maxScale, z));
        self.el.object3D.scale.setScalar(self.zoom);
      };

      // ---- タッチ：1本指は回転、2本指はピンチ ----
      this.onTouchStart = function (e) {
        if (e.touches.length >= 2) {
          self.dragging = false;
          self.velocity = 0;
          self.pinching = true;
          self.pinchStartDist = touchDist(e) || 1;
          self.pinchStartZoom = self.zoom;
        } else if (!self.pinching) {
          self.onDown(e);
        }
      };

      this.onTouchMove = function (e) {
        if (self.pinching) {
          if (e.touches.length >= 2) {
            self.setZoom(self.pinchStartZoom * touchDist(e) / self.pinchStartDist);
          }
          return;
        }
        self.onMove(e);
      };

      this.onTouchEnd = function (e) {
        if (self.pinching) {
          // 指が全部離れるまでは回転を再開しない（ピンチ後にモデルが跳ねるのを防ぐ）
          if (e.touches.length === 0) self.pinching = false;
          return;
        }
        self.onUp();
      };

      // ---- マウスホイール（トラックパッドのピンチも含む）----
      this.onWheel = function (e) {
        e.preventDefault();  // ブラウザ自体の拡大を止める
        self.setZoom(self.zoom * Math.exp(-e.deltaY * self.data.wheelSpeed));
      };

      // iOS Safari のページ拡大ジェスチャーを止める
      this.onGesture = function (e) {
        e.preventDefault();
      };

      this.onDown = function (e) {
        var p = getPoint(e);
        self.dragging = true;
        self.lastX = p.clientX;
        self.lastY = p.clientY;
        self.lastTime = performance.now();
        self.velocity = 0;
      };

      this.onMove = function (e) {
        if (!self.dragging) return;
        var p = getPoint(e);
        var now = performance.now();
        var dt = Math.max(now - self.lastTime, 1);
        var delta = (p.clientX - self.lastX) * self.data.speed;

        // 横回転
        self.el.object3D.rotation.z += delta;
        self.velocity = delta / dt;

        // 上下の傾き（範囲内に制限）
        // rotation の順序は XYZ なので、X の傾きは回転後のモデル全体に対して
        // カード基準でかかる（横回転しても傾く向きは常に画面の上下）
        var max = self.data.maxTilt * Math.PI / 180;
        self.tilt += (p.clientY - self.lastY) * self.data.speed;
        self.tilt = Math.max(-max, Math.min(max, self.tilt));
        self.el.object3D.rotation.x = self.tilt;

        self.lastX = p.clientX;
        self.lastY = p.clientY;
        self.lastTime = now;
      };

      this.onUp = function () {
        if (!self.dragging) return;
        self.dragging = false;
        // 指を止めてから離した場合は惰性なし
        if (performance.now() - self.lastTime > 100) self.velocity = 0;
      };

      window.addEventListener('mousedown', this.onDown);
      window.addEventListener('mousemove', this.onMove);
      window.addEventListener('mouseup', this.onUp);
      window.addEventListener('touchstart', this.onTouchStart, { passive: true });
      window.addEventListener('touchmove', this.onTouchMove, { passive: true });
      window.addEventListener('touchend', this.onTouchEnd);
      window.addEventListener('touchcancel', this.onTouchEnd);
      window.addEventListener('wheel', this.onWheel, { passive: false });
      window.addEventListener('gesturestart', this.onGesture, { passive: false });
      window.addEventListener('gesturechange', this.onGesture, { passive: false });
    },

    tick: function (time, delta) {
      if (this.dragging || !delta) return;
      if (Math.abs(this.velocity) < 0.00001) return;

      this.el.object3D.rotation.z += this.velocity * delta;
      // フレームレートに依存しない減衰
      this.velocity *= Math.pow(this.data.friction, delta / 16.67);
    },

    remove: function () {
      window.removeEventListener('mousedown', this.onDown);
      window.removeEventListener('mousemove', this.onMove);
      window.removeEventListener('mouseup', this.onUp);
      window.removeEventListener('touchstart', this.onTouchStart);
      window.removeEventListener('touchmove', this.onTouchMove);
      window.removeEventListener('touchend', this.onTouchEnd);
      window.removeEventListener('touchcancel', this.onTouchEnd);
      window.removeEventListener('wheel', this.onWheel);
      window.removeEventListener('gesturestart', this.onGesture);
      window.removeEventListener('gesturechange', this.onGesture);
    }

  });

}


</script>
</head>

<body>



<a-scene
  mindar-image="imageTargetSrc: ./targets.mind"
  color-space="sRGB"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="avatar" src="./character.glb"></a-asset-item>
   </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <!-- 回転用の親。GLBのアニメーションとぶつからないようモデル本体ではなくここを回す -->
    <a-entity position="0 0 0.1" drag-spin>
      <a-gltf-model
        id="avatarModel"
        src="#avatar"
        position="0 0 0"
        scale="2 2 2"
        rotation="0 0 0"
        animation-mixer
        draw-order>
      </a-gltf-model>
    </a-entity>
  </a-entity>

</a-scene>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindAR Card Test</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #err {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 99999;
    background: rgba(200, 0, 0, 0.9);
    color: #fff;
    font-size: 12px;
    padding: 6px 8px;
    display: none;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #meshBtn {
    position: fixed;
    right: 8px;
    bottom: 8px;
    z-index: 99998;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
  }
  #meshList {
    position: fixed;
    right: 8px;
    bottom: 44px;
    max-width: 80%;
    max-height: 50%;
    overflow: auto;
    z-index: 99998;
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    font-size: 12px;
    padding: 8px;
    border-radius: 6px;
    display: none;
    white-space: pre;
  }
</style>

<script>
/* エラーを画面に表示(スマホでコンソールが見られないため) */
window.addEventListener('error', function (e) {
  var box = document.getElementById('err');
  if (!box) return;
  box.style.display = 'block';
  box.textContent += (e.message || 'error') + '\n';
});

/*
  ORDER: メッシュ名 → 描画順。数字が大きいほど手前に描かれる。
  メッシュ名は画面右下の「mesh」ボタンで確認できる。
  例(名前は実際のものに書き換える):
    '水面': 1,
    'カード背景': 10,
    'キャラ': 11,
    '星': 12,
    '枠': 13
*/
var ORDER = {
  '水面': 1
};

/* ORDERに書いたカード用メッシュは、層の重なりを描画順で決める(深度判定を切る) */
var IGNORE_DEPTH_FOR_ORDERED = true;

/* ORDERに書いていない半透明メッシュの描画順 */
var DEFAULT_TRANSPARENT_ORDER = 2;

/*
  draw-order:
  マテリアルの見た目は触らず、描画順だけを調整する。
*/
if (window.AFRAME) {
  AFRAME.registerComponent('draw-order', {
    init: function () {
      var self = this;
      this.el.addEventListener('model-loaded', function () {
        try {
          var root = self.el.getObject3D('mesh');
          if (!root) return;

          var lines = [];

          root.traverse(function (obj) {
            if (!obj.isMesh || !obj.material) return;

            var mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            var name = obj.name;

            if (Object.prototype.hasOwnProperty.call(ORDER, name)) {
              obj.renderOrder = ORDER[name];
              mats.forEach(function (m) {
                m.transparent = true;
                m.depthWrite = false;
                if (IGNORE_DEPTH_FOR_ORDERED && name !== '水面') {
                  m.depthTest = false;
                }
                m.needsUpdate = true;
              });
            } else if (mats.some(function (m) { return m.transparent; })) {
              obj.renderOrder = DEFAULT_TRANSPARENT_ORDER;
            }

            lines.push(name + '  : ' + obj.renderOrder);
          });

          var list = document.getElementById('meshList');
          if (list) list.textContent = lines.join('\n');
        } catch (err) {
          var box = document.getElementById('err');
          if (box) {
            box.style.display = 'block';
            box.textContent += 'draw-order: ' + err.message + '\n';
          }
        }
      });
    }
  });
}

/* meshボタンで一覧の表示/非表示 */
window.addEventListener('DOMContentLoaded', function () {
  var btn = document.getElementById('meshBtn');
  var list = document.getElementById('meshList');
  if (!btn || !list) return;
  btn.addEventListener('click', function () {
    list.style.display = list.style.display === 'block' ? 'none' : 'block';
  });
});
</script>
</head>

<body>

<div id="err"></div>
<div id="meshList">モデル読み込み中...</div>
<div id="meshBtn">mesh</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind"
  color-space="sRGB"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="avatar" src="./character.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <!--
      マテリアルはglTF(character.glb)の設定をそのまま使う。
      描画順だけ draw-order で調整する。
      向きを直したいときは rotation の値だけ変更する。
    -->
    <a-gltf-model
      id="avatarModel"
      src="#avatar"
      position="0 0 0.1"
      scale="1 1 1"
      rotation="0 0 0"
      animation-mixer
      draw-order>
    </a-gltf-model>
  </a-entity>

</a-scene>

</body>
</html>

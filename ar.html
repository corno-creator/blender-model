<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindAR Card Test</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe
extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image
aframe.prod.js"></script>
<style>
  html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #err {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 99999;
    background: rgba(200, 0, 0, 0.9);
    color: #fff;
    font-size: 12px;
    padding: 6px 8px;
display: none;
    white-space: pre-wrap;
word-break: break-all;
  }
</style>
<script>
/* エラーを画面に表示(スマホでコンソールが見られないため) */
window.addEventListener('error', function (e) {
var box = document.getElementById('err');
if (!box) return;
box.style.display = 'block';
  box.textContent += (e.message || 'error') + '\n';
});
/*
  water-fix:
  独自シェーダーは使わず､glTFに入っているマテリアルの
  色と描画順だけを調整する｡
  - ｢水面｣: 青・半透明・depthWriteなし・先に描画
  - 他の半透明メッシュ: 水面より後に描画(カードが前に出る)
*/
if (window.AFRAME) {
  AFRAME.registerComponent('water-fix', {
    init: function () {
      var self = this;
      this.el.addEventListener('model-loaded', function () {
        try {
          var root = self.el.getObject3D('mesh');
          if (!root) return;
          root.traverse(function (obj) {
            if (!obj.isMesh || !obj.material) return;
            if (obj.name === '水面') {
              var m = obj.material;
              if (m.color) m.color.set(0x0080ff);
              if (m.emissive) m.emissive.set(0x000000);
              m.map = null;
              m.transparent = true;
              m.opacity = 0.8;
              m.depthWrite = false;
              m.side = AFRAME.THREE.DoubleSide;
              m.needsUpdate = true;
              obj.renderOrder = 1;
            } else if (obj.material.transparent) {
              obj.renderOrder = 2;
            }
          });
        } catch (err) {
          var box = document.getElementById('err');
          if (box) {
            box.style.display = 'block';
            box.textContent += 'water-fix: ' + err.message + '\n';
          }
        }
      });
    }
  });
}
</script>
</head>
<body>
<div id="err"></div>
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind"
  color-space="sRGB"
  embedded
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false">
  <a-assets>
    <a-asset-item id="avatar" src="./character.glb"></a-asset-item>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity mindar-image-target="targetIndex: 0">
<!-
水面の色と描画順だけ water-fix で調整する｡
向きを直したいときは rotation の値だけ変更する｡
    -->
    <a-gltf-model
id="avatarModel"
      src="#avatar"
      position="0 0 0.1"
      scale="1 1 1"
      rotation="0 0 0"
      animation-mixer
      water-fix>
    </a-gltf-model>
</a-entity>
</a-scene>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blender Model - Image AR</title>

<!-- three.js と addons の importmap（MindAR と互換性のある 0.152.2） -->
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:sans-serif;
}
#ar-container{
  position:fixed;
  inset:0;
  overflow:hidden;
}
#status{
  position:fixed;
  z-index:10;
  top:16px;
  left:16px;
  right:16px;
  padding:12px;
  color:white;
  background:rgba(0,0,0,.72);
  border-radius:10px;
  text-align:center;
}
#start-button{
  position:fixed;
  z-index:20;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  width:min(90%,360px);
  padding:16px;
  border:0;
  border-radius:12px;
  background:#1685ff;
  color:white;
  font-size:17px;
  font-weight:bold;
}
#start-button:disabled{
  background:#666;
}
#back-link{
  position:fixed;
  z-index:20;
  top:16px;
  right:16px;
  padding:10px 12px;
  border-radius:8px;
  color:white;
  background:rgba(0,0,0,.72);
  text-decoration:none;
  font-size:14px;
}
#ar-container video,
#ar-container canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
#ar-container video{z-index:0}
#ar-container canvas{
  z-index:1;
  pointer-events:none;
}
.hidden{display:none!important}
</style>
</head>

<body>
<div id="ar-container"></div>
<div id="status">3Dモデルと画像認識データを読み込んでいます...</div>
<a id="back-link" href="./">モデル確認へ戻る</a>
<button id="start-button" disabled>読み込み中...</button>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {MindARThree} from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-three.module.js";

const MODEL_URL="./character.glb";
const TARGET_URL="./targets.mind";

const container=document.getElementById("ar-container");
const status=document.getElementById("status");
const startButton=document.getElementById("start-button");

let mindar=null;
let model=null;
let mixer=null;
let arStarted=false;
let starting=false;

const clock=new THREE.Clock();

/* ============================================================
   水面用Uniform
============================================================ */
const waterUniforms={
  uTime:{value:0},
  uScale:{value:6.8}
};

/* ============================================================
   水面 Vertex Shader（あなたの全文）
============================================================ */
const waterVertexShader = `
uniform float uTime;
uniform float uScale;
varying vec3 vWorldPosition;
varying vec3 vWorldNormal;
varying vec3 vPosition;

float random(vec2 st){
  return fract(sin(dot(st,vec2(12.9898,78.233)))*43758.5453123);
}

float noise(vec2 st){
  vec2 i=floor(st);
  vec2 f=fract(st);
  float a=random(i);
  float b=random(i+vec2(1.0,0.0));
  float c=random(i+vec2(0.0,1.0));
  float d=random(i+vec2(1.0,1.0));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(a,b,u.x)
    +(c-a)*u.y*(1.0-u.x)
    +(d-b)*u.x*u.y;
}

float getWave(vec2 position){
  float wave=0.0;
  wave+=noise(position*1.0+vec2(uTime*0.15))*0.009;
  wave+=noise(position*2.0-vec2(uTime*0.10))*0.008;
  wave+=noise(position*3.0+vec2(uTime*0.20))*0.002;
  return wave;
}

void main(){
  vec3 newPosition=position;
  newPosition.y+=getWave(position.xz);

  vec4 worldPosition=modelMatrix*vec4(newPosition,1.0);
  vPosition=newPosition;
  vWorldPosition=worldPosition.xyz;
  vWorldNormal=normalize(mat3(modelMatrix)*normal);

  gl_Position=projectionMatrix*viewMatrix*worldPosition;
}
`;

/* ============================================================
   水面 Fragment Shader（あなたの全文）
============================================================ */
const waterFragmentShader = `
uniform float uTime;
uniform float uScale;

varying vec3 vWorldPosition;
varying vec3 vWorldNormal;
varying vec3 vPosition;

float random(vec2 st){
  return fract(sin(dot(st,vec2(12.9898,78.233)))*43758.5453123);
}

float noise(vec2 st){
  vec2 i=floor(st);
  vec2 f=fract(st);
  float a=random(i);
  float b=random(i+vec2(1.0,0.0));
  float c=random(i+vec2(0.0,1.0));
  float d=random(i+vec2(1.0,1.0));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(a,b,u.x)
    +(c-a)*u.y*(1.0-u.x)
    +(d-b)*u.x*u.y;
}

float fbm(vec2 st){
  float value=0.0;
  float amplitude=0.5;
  float frequency=1.0;

  for(int i=0;i<4;i++){
    value+=amplitude*noise(st*frequency);
    frequency*=2.0;
    amplitude*=0.5;
  }
  return value;
}

float voronoi(vec2 x){
  vec2 n=floor(x);
  vec2 f=fract(x);
  float minDist=1.0;

  for(int j=-1;j<=1;j++){
    for(int i=-1;i<=1;i++){
      vec2 neighbor=vec2(float(i),float(j));
      vec2 point=neighbor+vec2(
        random(n+neighbor),
        random(n+neighbor+vec2(31.7,17.3))
      );
      vec2 difference=point-f;
      float distanceValue=dot(difference,difference);
      minDist=min(minDist,distanceValue);
    }
  }
  return sqrt(minDist);
}

vec3 rainbowColor(float value){
  vec3 color1=vec3(0.20,0.07,0.09);
  vec3 color2=vec3(0.22,0.14,0.07);
  vec3 color3=vec3(0.23,0.21,0.08);
  vec3 color4=vec3(0.08,0.23,0.13);
  vec3 color5=vec3(0.07,0.20,0.23);
  vec3 color6=vec3(0.07,0.11,0.23);
  vec3 color7=vec3(0.17,0.07,0.23);

  if(value<0.16)
    return mix(color1,color2,value/0.16);
  else if(value<0.32)
    return mix(color2,color3,(value-0.16)/0.16);
  else if(value<0.48)
    return mix(color3,color4,(value-0.32)/0.16);
  else if(value<0.64)
    return mix(color4,color5,(value-0.48)/0.16);
  else if(value<0.80)
    return mix(color5,color6,(value-0.64)/0.16);
  else
    return mix(color6,color7,(value-0.80)/0.20);
}

void main(){
  vec2 position=vPosition.xz*uScale;

  position.x+=uTime*0.08;
  position.y+=uTime*0.04;

  float noiseValue=fbm(position);
  float voronoiValue=voronoi(position*0.73);
  float pattern=noiseValue*0.65+voronoiValue*0.35;
  vec3 color=rainbowColor(pattern);

  vec3 viewDirection=normalize(cameraPosition-vWorldPosition);
  vec3 normalDirection=normalize(vWorldNormal);

  float fresnel=1.0-max(dot(normalDirection,viewDirection),0.0);
  fresnel=smoothstep(0.15,0.85,fresnel);

  color+=vec3(0.10,0.12,0.14)*fresnel;
  color=mix(color,vec3(0.12,0.13,0.14),0.25);
  color+=vec3(0.12)*smoothstep(0.65,1.0,pattern);

  float alpha=mix(0.28,0.72,fresnel);
  gl_FragColor=vec4(color,alpha);
}
`;

/* ============================================================
   水面Material
============================================================ */
const waterMaterial=new THREE.ShaderMaterial({
  uniforms:waterUniforms,
  vertexShader:waterVertexShader,
  fragmentShader:waterFragmentShader,
  side:THREE.DoubleSide,
  transparent:true,
  depthWrite:false
});

/* ============================================================
   GLB読み込み
============================================================ */
function loadModel(){
  return new Promise((resolve,reject)=>{
    const loader=new GLTFLoader();

    loader.load(
      MODEL_URL,
      (gltf)=>{
        model=gltf.scene;

        model.traverse((object)=>{
          if(object.isMesh && object.name==="水面"){
            object.material=waterMaterial;
          }
        });

        const box=new THREE.Box3().setFromObject(model);
        const center=box.getCenter(new THREE.Vector3());
        const size=box.getSize(new THREE.Vector3());
        const maxSize=Math.max(size.x,size.y,size.z);

        model.position.sub(center);

        if(maxSize>0){
          model.scale.setScalar(0.7/maxSize);
        }

        if(gltf.animations && gltf.animations.length>0){
          mixer=new THREE.AnimationMixer(model);
          for(const clip of gltf.animations){
            mixer.clipAction(clip).reset().play();
          }
        }

        resolve(model);
      },
      (progress)=>{
        if(progress.total>0){
          const percent=Math.round(progress.loaded/progress.total*100);
          status.textContent="3Dモデル読み込み中... "+percent+"%";
        }else{
          status.textContent="3Dモデルを読み込んでいます...";
        }
      },
      (error)=>{
        reject(new Error("character.glbを読み込めません。ファイル名と配置を確認してください。"));
      }
    );
  });
}

/* ============================================================
   画像認識データの確認
============================================================ */
async function checkTarget(){
  const response=await fetch(TARGET_URL);
  if(!response.ok){
    throw new Error("targets.mindを読み込めません。ファイル名と配置を確認してください。");
  }
  await response.arrayBuffer();
}

/* ============================================================
   ARの準備
============================================================ */
function setupAR(){
  mindar=new MindARThree({
    container:container,
    imageTargetSrc:TARGET_URL,
    maxTrack:1
  });

  const renderer=mindar.renderer;
  const scene=mindar.scene;
  const camera=mindar.camera;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000,0);

  scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));
  const directionalLight=new THREE.DirectionalLight(0xffffff,3);
  directionalLight.position.set(3,5,3);
  scene.add(directionalLight);

  const anchor=mindar.addAnchor(0);
  anchor.group.add(model);

  anchor.onTargetFound=()=>{
    status.textContent="画像を認識しました";
  };

  anchor.onTargetLost=()=>{
    status.textContent="認識画像をカメラに映してください";
  };

  return {renderer,scene,camera};
}

/* ============================================================
   AR起動ボタン
============================================================ */
startButton.addEventListener("click",async()=>{
  if(starting||arStarted||!model)return;

  starting=true;
  startButton.disabled=true;
  startButton.textContent="ARを起動しています...";

  if(!window.isSecureContext||
     !navigator.mediaDevices||
     !navigator.mediaDevices.getUserMedia){
    starting=false;
    startButton.disabled=false;
    startButton.textContent="もう一度試す";
    status.textContent="HTTPSのURLで開き、カメラを使用できるブラウザで試してください。";
    return;
  }

  try{
    status.textContent="カメラを起動しています...";
    const ar=setupAR();

    await mindar.start();

    arStarted=true;
    starting=false;
    startButton.classList.add("hidden");
    status.textContent="認識画像をカメラに映してください";

    ar.renderer.setAnimationLoop(()=>{
      const delta=clock.getDelta();

      waterUniforms.uTime.value+=delta;

      if(mixer){
        mixer.update(delta);
      }

      ar.renderer.render(ar.scene,ar.camera);
    });
  }catch(error){
    starting=false;
    arStarted=false;

    try{
      if(mindar)mindar.stop();
    }catch(stopError){}

    status.textContent="ARを起動できませんでした。カメラの許可と認識画像を確認してください。";
    startButton.disabled=false;
    startButton.textContent="もう一度ARを起動";
  }
});

/* ============================================================
   最初にモデルと認識データを読み込む
============================================================ */
async function preload(){
  startButton.disabled=true;
  startButton.textContent="読み込み中...";

  try{
    status.textContent="画像認識データを確認しています...";
    await checkTarget();

    status.textContent="3Dモデルを読み込んでいます...";
    await loadModel();

    status.textContent="読み込み完了。ARを起動できます。";
    startButton.disabled=false;
    startButton.textContent="画像認識ARを起動";
  }catch(error){
    status.textContent="読み込みエラー: "+error.message;
    startButton.disabled=true;
    startButton.textContent="読み込みエラー";
  }
}

window.addEventListener("pagehide",()=>{
  try{
    if(mindar)mindar.stop();
  }catch(error){}
});

preload();
</script>
</body>
</html>

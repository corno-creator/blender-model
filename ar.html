<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLB Viewer</title>

<script type="importmap">
{
  "imports": {
    "three":"https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

#msg{
  position:fixed;
  top:10px;
  left:10px;
  background:black;
  color:white;
  padding:10px;
  z-index:9999;
}
</style>
</head>

<body>

<div id="msg">読み込み中...</div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader }
from "three/addons/loaders/GLTFLoader.js";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

const msg =
document.getElementById("msg");

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0xeeeeee);

const camera =
new THREE.PerspectiveCamera(
60,
window.innerWidth /
window.innerHeight,
0.1,
1000
);

camera.position.set(
0,
1,
3
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
Math.min(
window.devicePixelRatio,
2
)
);

document.body.appendChild(
renderer.domElement
);

const controls =
new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;

const hemi =
new THREE.HemisphereLight(
0xffffff,
0x444444,
2
);

scene.add(hemi);

const dir =
new THREE.DirectionalLight(
0xffffff,
3
);

dir.position.set(
3,
5,
3
);

scene.add(dir);

const loader =
new GLTFLoader();

loader.load(

"./character.glb",

(gltf)=>{

const model =
gltf.scene;

scene.add(model);

const box =
new THREE.Box3()
.setFromObject(model);

const center =
box.getCenter(
new THREE.Vector3()
);

const size =
box.getSize(
new THREE.Vector3()
);

const maxSize =
Math.max(
size.x,
size.y,
size.z
);

model.position.sub(
center
);

camera.position.set(
0,
maxSize * 0.5,
maxSize * 2.5
);

controls.target.set(
0,
0,
0
);

controls.update();

msg.textContent =
"モデル表示成功";

},

undefined,

(error)=>{

console.error(error);

msg.textContent =
"GLB失敗";

}

);

function animate(){

requestAnimationFrame(
animate
);

controls.update();

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>

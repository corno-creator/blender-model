<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLB Test</title>

<script type="importmap">
{
  "imports": {
    "three":"https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

#msg{
  position:fixed;
  top:10px;
  left:10px;
  background:black;
  color:white;
  padding:10px;
  z-index:9999;
}
</style>
</head>

<body>

<div id="msg">開始</div>

<script type="module">

import * as THREE from "three";
  console.log("Three OK");
document.getElementById("msg").textContent="Three OK";
import {GLTFLoader}
from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  innerWidth/innerHeight,
  0.1,
  1000
);

camera.position.set(
  0,
  1,
  3
);

const renderer =
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  innerWidth,
  innerHeight
);

document.body.appendChild(
  renderer.domElement
);

const light =
new THREE.HemisphereLight(
  0xffffff,
  0x444444,
  2
);

scene.add(light);
  const loader =
new GLTFLoader();

loader.load(
  "./character.glb",

  function(gltf){

    console.log("成功");
    console.log(gltf);

    scene.add(gltf.scene);

    document.getElementById("msg")
      .textContent="GLB成功";

  },

  function(gltf){

    scene.add(
      gltf.scene
    );

    document.getElementById("msg")
      .textContent =
      "GLB成功";

  },

  undefined,

  function(error){

    console.error(error);

    document.getElementById("msg")
      .textContent =
      "GLB失敗";

  }
);
  const loader =
new GLTFLoader();

loader.load(
  "./character.glb",

  function(gltf){

    console.log("成功");
    console.log(gltf);

    scene.add(gltf.scene);

    document.getElementById("msg")
      .textContent="GLB成功";

  },

  function(gltf){

    scene.add(
      gltf.scene
    );

    document.getElementById("msg")
      .textContent =
      "GLB成功";

  },

  undefined,

  function(error){

    console.error(error);

    document.getElementById("msg")
      .textContent =
      "GLB失敗";

  }
);

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindAR Card Test</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }


</style>

<script>


/*
  描画順
  水面 → 1
  平面004系(CardBack/CardText/側面) → 10
  CardCharacter → 20
  CardStar → 30
*/
function getAutoOrder(name) {

  if (!name) return null;

  if (name.indexOf('水面') !== -1) {
    return 1;
  }

  if (name.indexOf('平面004') === 0) {
    return 10;
  }

  if (name.indexOf('CardCharacter') === 0) {
    return 20;
  }

  if (name.indexOf('CardStar') === 0) {
    return 30;
  }

  return null;
}


if (window.AFRAME) {

  AFRAME.registerComponent('draw-order', {

    init: function () {

      var self = this;

      this.el.addEventListener('model-loaded', function () {

        var root = self.el.getObject3D('mesh');

        if (!root) return;

        root.traverse(function (obj) {

          if (!obj.isMesh || !obj.material) return;

          var name = obj.name || '';
var order = getAutoOrder(name);

if (order !== null) {

  obj.renderOrder = order;

  var mats = Array.isArray(obj.material)
    ? obj.material
    : [obj.material];

  mats.forEach(function (m) {
    m.needsUpdate = true;
  });

}

          if (order !== null) {

            obj.renderOrder = order;

            mats.forEach(function (m) {
  m.needsUpdate = true;
});


          }

        });

      });

    }

  });

}


</script>
</head>

<body>



<a-scene
  mindar-image="imageTargetSrc: ./targets.mind"
  color-space="sRGB"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="avatar" src="./character.glb"></a-asset-item>
   </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model
      id="avatarModel"
      src="#avatar"
      position="0 0 0.1"
      scale="2.5 2.5 2.5"
      rotation="-30 0 0"
      animation-mixer
      draw-order>
    </a-gltf-model>
  </a-entity>

</a-scene>

</body>
</html>

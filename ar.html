<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindAR Card Test</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;  /* スワイプでページがスクロール・ズームしないように */
  }


</style>

<script>


/*
  描画順
  水面 → 1
  平面004系(CardBack/CardText/側面) → 10
  CardCharacter → 20
  CardStar → 30
*/
function getAutoOrder(name) {

  if (!name) return null;

  if (name.indexOf('水面') !== -1) {
    return 1;
  }

  if (name.indexOf('平面004') === 0) {
    return 10;
  }

  if (name.indexOf('CardCharacter') === 0) {
    return 20;
  }

  if (name.indexOf('CardStar') === 0) {
    return 30;
  }

  return null;
}


if (window.AFRAME) {

  AFRAME.registerComponent('draw-order', {

    init: function () {

      var self = this;

      this.el.addEventListener('model-loaded', function () {

        var root = self.el.getObject3D('mesh');

        if (!root) return;

        root.traverse(function (obj) {

          if (!obj.isMesh || !obj.material) return;

          var name = obj.name || '';
var order = getAutoOrder(name);

if (order !== null) {

  obj.renderOrder = order;

  var mats = Array.isArray(obj.material)
    ? obj.material
    : [obj.material];

  mats.forEach(function (m) {
    m.needsUpdate = true;
  });

}

          if (order !== null) {

            obj.renderOrder = order;

            mats.forEach(function (m) {
  m.needsUpdate = true;
});


          }

        });

      });

    }

  });

}

/*
  ドラッグ / スワイプで回転（離すと惰性でくるくる回り、徐々に減速）
  横方向の動き → Y軸回転
*/
if (window.AFRAME) {

  AFRAME.registerComponent('drag-spin', {

    schema: {
      speed: { type: 'number', default: 0.01 },     // 1px あたりの回転量(rad)
      friction: { type: 'number', default: 0.95 }   // 惰性の減衰（1に近いほど長く回る）
    },

    init: function () {

      var self = this;
      this.dragging = false;
      this.lastX = 0;
      this.lastTime = 0;
      this.velocity = 0;  // rad / ms

      function getX(e) {
        return e.touches ? e.touches[0].clientX : e.clientX;
      }

      this.onDown = function (e) {
        self.dragging = true;
        self.lastX = getX(e);
        self.lastTime = performance.now();
        self.velocity = 0;
      };

      this.onMove = function (e) {
        if (!self.dragging) return;
        var x = getX(e);
        var now = performance.now();
        var dx = x - self.lastX;
        var dt = Math.max(now - self.lastTime, 1);
        var delta = dx * self.data.speed;

        self.el.object3D.rotation.y += delta;
        self.velocity = delta / dt;

        self.lastX = x;
        self.lastTime = now;
      };

      this.onUp = function () {
        if (!self.dragging) return;
        self.dragging = false;
        // 指を止めてから離した場合は惰性なし
        if (performance.now() - self.lastTime > 100) self.velocity = 0;
      };

      window.addEventListener('mousedown', this.onDown);
      window.addEventListener('mousemove', this.onMove);
      window.addEventListener('mouseup', this.onUp);
      window.addEventListener('touchstart', this.onDown, { passive: true });
      window.addEventListener('touchmove', this.onMove, { passive: true });
      window.addEventListener('touchend', this.onUp);
      window.addEventListener('touchcancel', this.onUp);
    },

    tick: function (time, delta) {
      if (this.dragging || !delta) return;
      if (Math.abs(this.velocity) < 0.00001) return;

      this.el.object3D.rotation.y += this.velocity * delta;
      // フレームレートに依存しない減衰
      this.velocity *= Math.pow(this.data.friction, delta / 16.67);
    },

    remove: function () {
      window.removeEventListener('mousedown', this.onDown);
      window.removeEventListener('mousemove', this.onMove);
      window.removeEventListener('mouseup', this.onUp);
      window.removeEventListener('touchstart', this.onDown);
      window.removeEventListener('touchmove', this.onMove);
      window.removeEventListener('touchend', this.onUp);
      window.removeEventListener('touchcancel', this.onUp);
    }

  });

}


</script>
</head>

<body>



<a-scene
  mindar-image="imageTargetSrc: ./targets.mind"
  color-space="sRGB"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="avatar" src="./character.glb"></a-asset-item>
   </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <!-- 回転用の親。GLBのアニメーションとぶつからないようモデル本体ではなくここを回す -->
    <a-entity position="0 0 0.1" drag-spin>
      <a-gltf-model
        id="avatarModel"
        src="#avatar"
        position="0 0 0"
        scale="2.5 2.5 2.5"
        rotation="0 0 0"
        animation-mixer
        draw-order>
      </a-gltf-model>
    </a-entity>
  </a-entity>

</a-scene>

</body>
</html>
